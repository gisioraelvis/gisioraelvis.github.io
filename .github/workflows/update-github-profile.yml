name: Sync GitHub Profile README

on:
  push:
    branches:
      - main
    paths:
      - "github-profile/README.md"
  # Manual trigger
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v3
        with:
          path: portfolio

      - name: Checkout profile repository
        uses: actions/checkout@v3
        with:
          repository: gisioraelvis/gisioraelvis
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile

      - name: Process README file (remove note)
        run: |
          # Create a clean copy without the note
          sed '1,3d' portfolio/github-profile/README.md > cleaned_readme.md
          cp cleaned_readme.md profile/README.md

      - name: Commit and push if changed
        run: |
          cd profile
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update profile README"
          git push
